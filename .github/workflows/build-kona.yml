name: kona-ohos-kernel

on:
  workflow_dispatch:
  push:
    branches: [ hmos-ci ]

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8250.git
  KERNEL_BRANCH: lineage-24.0
  DEFCONFIG: vendor/kona-perf_defconfig
  MAKE_ARGS: O=out ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  build:
    name: build-kona
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: checkout ci
        uses: actions/checkout@v4
        with:
          path: ci

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev zip unzip cpio rsync lz4 \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler
          echo "---- clang ----"
          clang --version | head -2
          ld.lld --version
          aarch64-linux-gnu-gcc --version | head -1

      - name: clone kernel
        run: |
          git clone --depth 1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" kona
          git -C kona config user.email ci@local
          git -C kona config user.name ci
          git -C kona log -1 --format='%H %s' | tee ci/kernel-commit.txt

      - name: defconfig (auto-stub missing kconfigs)
        run: |
          set -o pipefail
          for i in $(seq 1 40); do
            if make -C kona $MAKE_ARGS "$DEFCONFIG" > /tmp/dc.log 2>&1; then
              echo "defconfig OK (iterations=$i)"; head -n 5 /tmp/dc.log; break
            fi
            miss=$(grep -oP 'can.t open file "\K[^"]+' /tmp/dc.log | head -1)
            if [ -z "$miss" ]; then
              echo "---- defconfig failed, no missing kconfig found ----"
              tail -n 40 /tmp/dc.log
              exit 1
            fi
            echo "stub missing kconfig: $miss"
            # 公开树里很多 OPLUS 路径是悬空符号链接，逐级拆掉再建目录
            cur="kona"
            IFS='/' read -ra parts <<< "$(dirname "$miss")"
            for part in "${parts[@]}"; do
              cur="$cur/$part"
              if [ -L "$cur" ]; then rm -f "$cur"; fi
              if [ -e "$cur" ] && [ ! -d "$cur" ]; then rm -f "$cur"; fi
              mkdir -p "$cur"
              git -C kona add -A >/dev/null 2>&1 || true
            done
            if [ -L "kona/$miss" ]; then rm -f "kona/$miss"; fi
            printf '# auto-stub: OPLUS feature source not shipped in public tree\n' > "kona/$miss"
            git -C kona add -A
            git -C kona commit -qm "stub $miss"
          done
          cp kona/out/.config ci/kona-perf_defconfig.used

      # 基线是硬门禁：失败时 subsequent patched 步骤全部跳过，但日志与 Image.gz 仍上传。
      - name: build BASELINE Image.gz (no patches)
        id: baseline
        continue-on-error: true
        run: |
          set -o pipefail
          make -C kona $MAKE_ARGS KCFLAGS="-Wno-error" -j"$(nproc)" Image.gz 2>&1 | tee ci/build-baseline.log | tail -n 30
          echo "BASELINE OK"

      - name: apply ohos patches (strict, no fuzz)
        if: steps.baseline.outcome == 'success'
        run: |
          cd kona
          : > ../ci/patch-report.txt
          shopt -s nullglob
          fail=0
          for p in ../ci/patches/*.patch; do
            n=$(basename "$p")
            if git apply --check "$p"; then
              git apply "$p"
              echo "APPLIED    $n" >> ../ci/patch-report.txt
            else
              git apply --check "$p" > "../ci/reject-$n.txt" 2>&1 || true
              echo "REJECTED   $n" >> ../ci/patch-report.txt
              fail=1
            fi
            git add -A >/dev/null 2>&1
            git commit -qm "apply $n" --allow-empty >/dev/null 2>&1
          done
          cat ../ci/patch-report.txt
          if [ "$fail" -ne 0 ]; then
            echo "::error::patch set does not apply cleanly on this tree"
            exit 1
          fi

      # 先只编译被补丁触及的对象，快速暴露 4.19 适配错误
      - name: compile touched objects (fast fail)
        if: steps.baseline.outcome == 'success'
        run: |
          set -o pipefail
          make -C kona $MAKE_ARGS "$DEFCONFIG" 2>&1 | tail -n 3
          if make -C kona $MAKE_ARGS vendor/ohos.config > /tmp/oc.log 2>&1; then
            echo "ohos.config merged via make target"
          else
            cat kona/arch/arm64/configs/vendor/ohos.config >> kona/out/.config
            echo "ohos.config appended manually"
          fi
          make -C kona $MAKE_ARGS olddefconfig 2>&1 | tail -n 3
          grep -E 'CONFIG_ACCESS_TOKENID|CONFIG_BINDER_SENDER_INFO|CONFIG_ANDROID_BINDERFS|CONFIG_OHOS|CONFIG_DM_PARTNAME|CONFIG_EROFS_FS' kona/out/.config >> ci/patch-report.txt || true
          make -C kona $MAKE_ARGS KCFLAGS="-Wno-error" -j"$(nproc)" \
            kernel/fork.o kernel/reboot.o drivers/tty/sysrq.o \
            security/selinux/selinuxfs.o block/genhd.o \
            drivers/android/binder.o drivers/accesstokenid/access_tokenid.o \
            2>&1 | tee ci/build-objects.log | tail -n 40

      - name: build PATCHED Image.gz (with ohos config)
        if: steps.baseline.outcome == 'success'
        run: |
          set -o pipefail
          make -C kona $MAKE_ARGS KCFLAGS="-Wno-error" -j"$(nproc)" Image.gz 2>&1 | tee ci/build-patched.log | tail -n 30

      - name: collect
        if: always()
        run: |
          mkdir -p ci/artifact/baseline
          cp ci/kona-perf_defconfig.used ci/artifact/baseline/ 2>/dev/null || true
          cp ci/build-baseline.log ci/artifact/baseline/ 2>/dev/null || true
          cp ci/build-objects.log ci/artifact/ 2>/dev/null || true
          cp ci/build-patched.log ci/artifact/ 2>/dev/null || true
          cp ci/patch-report.txt ci/artifact/ 2>/dev/null || true
          cp ci/reject-*.txt ci/artifact/ 2>/dev/null || true
          if [ -f kona/out/arch/arm64/boot/Image.gz ]; then
            cp kona/out/arch/arm64/boot/Image.gz ci/artifact/baseline/ || true
            cp kona/out/.config ci/artifact/baseline/kona-ohos_defconfig.used || true
            echo "Image.gz present (patched tree)"
          fi
          cd ci/artifact && find . -type f -exec md5sum {} \; | sort > MD5.txt && cat MD5.txt

      - name: gate
        if: always()
        run: |
          mkdir -p ci/artifact
          if [ -f kona/out/arch/arm64/boot/Image.gz ] && [ "${{ steps.baseline.outcome }}" != "success" ]; then
            cp kona/out/arch/arm64/boot/Image.gz ci/artifact/baseline/ 2>/dev/null || true
          fi
          if [ "${{ steps.baseline.outcome }}" != "success" ]; then
            echo "::error::baseline build failed - fix tree/toolchain before patching"
            exit 1
          fi

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kona-ohos
          path: ci/artifact
          retention-days: 7
