name: kona-ohos-kernel

on:
  workflow_dispatch:
  push:
    branches: [ hmos-ci ]

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git
  KERNEL_BRANCH: oneplus/sm8250_u_14.0.0_op9r
  DEFCONFIG: vendor/kona-perf_defconfig

jobs:
  build:
    name: build-baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: checkout ci
        uses: actions/checkout@v4
        with:
          path: ci

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev zip unzip cpio rsync \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler lz4
          aarch64-linux-gnu-gcc --version | head -1

      - name: clone kernel
        run: |
          git clone --depth 1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" kona
          git -C kona log -1 --format='%H %s' | tee ci/kernel-commit.txt

      - name: apply ohos patches
        run: |
          cd kona
          : > ../ci/patch-report.txt
          shopt -s nullglob
          for p in ../ci/patches/*.patch; do
            n=$(basename "$p")
            if git apply --check "$p" >/dev/null 2>&1; then
              git apply "$p" && echo "APPLIED    $n" >> ../ci/patch-report.txt
            elif patch -p1 --forward --fuzz=3 --no-backup-if-mismatch < "$p" >/dev/null 2>&1; then
              echo "APPLIED-FZ $n" >> ../ci/patch-report.txt
            else
              git checkout -- . 2>/dev/null
              git clean -fdq 2>/dev/null
              echo "SKIPPED    $n" >> ../ci/patch-report.txt
            fi
          done
          cat ../ci/patch-report.txt

      - name: defconfig
        run: |
          make -C kona O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"
          grep -E 'CONFIG_ACCESS_TOKENID|CONFIG_BINDER_SENDER_INFO|CONFIG_OHOS' kona/out/.config || true

      - name: build Image.gz
        run: |
          set -o pipefail
          make -C kona O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" -j"$(nproc)" Image.gz 2>&1 | tee ci/build.log | tail -n 40

      - name: build dtbs (optional)
        continue-on-error: true
        run: |
          set -o pipefail
          make -C kona O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" -j"$(nproc)" dtbs 2>&1 | tee ci/build-dtbs.log | tail -n 20

      - name: collect
        if: always()
        run: |
          mkdir -p ci/artifact
          cp kona/out/arch/arm64/boot/Image.gz ci/artifact/ 2>/dev/null || true
          cp kona/out/arch/arm64/boot/Image ci/artifact/ 2>/dev/null || true
          cp kona/out/.config ci/artifact/kona-perf_defconfig.used 2>/dev/null || true
          find kona/out/arch/arm64/boot/dts -name '*.dtb' -exec cp {} ci/artifact/ \; 2>/dev/null || true
          tail -n 300 ci/build.log > ci/artifact/build-tail.log 2>/dev/null || true
          cp ci/patch-report.txt ci/artifact/ 2>/dev/null || true
          cd ci/artifact && md5sum * > MD5.txt && cat MD5.txt

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kona-baseline
          path: ci/artifact
          retention-days: 7

  probe:
    name: probe-patches
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: checkout ci
        uses: actions/checkout@v4
        with:
          path: ci

      - name: clone kernel
        run: |
          git clone --depth 1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" kona

      - name: dry-run patches
        continue-on-error: true
        run: |
          cd kona
          shopt -s nullglob
          : > ../ci/patch-probe.txt
          for p in ../ci/patches/*.patch; do
            {
              echo "##### $(basename "$p")"
              git apply --check "$p" 2>&1 && echo "git-apply: CLEAN" || echo "git-apply: needs fuzz/port"
              patch -p1 --dry-run --fuzz=3 --no-backup-if-mismatch < "$p" 2>&1 | tail -n 60
              echo
            } >> ../ci/patch-probe.txt
          done
          cat ../ci/patch-probe.txt

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-probe
          path: ci/patch-probe.txt
          retention-days: 7
