name: kona-ohos-kernel

on:
  workflow_dispatch:
  push:
    branches: [ hmos-ci ]

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git
  KERNEL_BRANCH: oneplus/sm8250_u_14.0.0_op9r
  DEFCONFIG: vendor/kona-perf_defconfig
  MAKE_ARGS: O=out ARCH=arm64 LLVM=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  build:
    name: build-kona
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: checkout ci
        uses: actions/checkout@v4
        with:
          path: ci

      - name: install toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev zip unzip cpio rsync lz4 \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler
          echo "---- clang ----"
          clang --version | head -2
          ld.lld --version
          aarch64-linux-gnu-gcc --version | head -1

      - name: clone kernel
        run: |
          git clone --depth 1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" kona
          git -C kona config user.email ci@local
          git -C kona config user.name ci
          git -C kona log -1 --format='%H %s' | tee ci/kernel-commit.txt

      - name: defconfig (auto-stub missing oplus kconfigs)
        run: |
          set -o pipefail
          for i in $(seq 1 40); do
            if make -C kona $MAKE_ARGS "$DEFCONFIG" > /tmp/dc.log 2>&1; then
              echo "defconfig OK (iterations=$i)"; head -n 5 /tmp/dc.log; break
            fi
            miss=$(grep -oP 'can.t open file "\K[^"]+' /tmp/dc.log | head -1)
            if [ -z "$miss" ]; then
              echo "---- defconfig failed, no missing kconfig found ----"
              tail -n 40 /tmp/dc.log
              exit 1
            fi
            echo "stub missing kconfig: $miss"
            mkdir -p "kona/$(dirname "$miss")"
            printf '# auto-stub: OPLUS feature source not shipped in public tree\n' > "kona/$miss"
            git -C kona add -A
            git -C kona commit -qm "stub $miss"
          done
          cp kona/out/.config ci/kona-perf_defconfig.used

      - name: build BASELINE Image.gz (no patches)
        continue-on-error: true
        run: |
          set -o pipefail
          make -C kona $MAKE_ARGS KCFLAGS="-Wno-error" -j"$(nproc)" Image.gz 2>&1 | tee ci/build-baseline.log | tail -n 30
          mkdir -p ci/artifact/baseline
          cp kona/out/arch/arm64/boot/Image.gz ci/artifact/baseline/
          cp ci/kona-perf_defconfig.used ci/artifact/baseline/kona-perf_defconfig.used 2>/dev/null || true
          tail -n 400 ci/build-baseline.log > ci/artifact/baseline/build-tail.log
          echo "BASELINE OK"

      - name: apply ohos patches
        run: |
          cd kona
          : > ../ci/patch-report.txt
          shopt -s nullglob
          for p in ../ci/patches/*.patch; do
            n=$(basename "$p")
            if git apply --check "$p" >/dev/null 2>&1; then
              git apply "$p" && echo "APPLIED    $n" >> ../ci/patch-report.txt
            else
              rm -rf /tmp/rej && mkdir -p /tmp/rej
              patch -p1 --forward --fuzz=3 --no-backup-if-mismatch -r /tmp/rej < "$p" > /tmp/po 2>&1 || true
              if [ -n "$(ls -A /tmp/rej 2>/dev/null)" ]; then
                git checkout -- . 2>/dev/null
                git clean -fdq 2>/dev/null
                echo "REVERTED   $n" >> ../ci/patch-report.txt
                continue
              fi
              echo "APPLIED-FZ $n" >> ../ci/patch-report.txt
            fi
            git add -A >/dev/null 2>&1
            git commit -qm "apply $n" --allow-empty >/dev/null 2>&1
          done
          cat ../ci/patch-report.txt

      - name: build PATCHED Image.gz (with ohos config)
        run: |
          set -o pipefail
          make -C kona $MAKE_ARGS "$DEFCONFIG" 2>&1 | tail -n 5
          if make -C kona $MAKE_ARGS vendor/ohos.config 2>&1 | tail -n 5; then
            echo "ohos.config merged via make target"
          else
            cat kona/arch/arm64/configs/vendor/ohos.config >> kona/out/.config
            echo "ohos.config appended manually"
          fi
          make -C kona $MAKE_ARGS olddefconfig 2>&1 | tail -n 5
          grep -E 'CONFIG_ACCESS_TOKENID|CONFIG_BINDER_SENDER_INFO|CONFIG_OHOS|CONFIG_DM_PARTNAME' kona/out/.config >> ci/patch-report.txt || true
          make -C kona $MAKE_ARGS KCFLAGS="-Wno-error" -j"$(nproc)" Image.gz 2>&1 | tee ci/build-patched.log | tail -n 30
          mkdir -p ci/artifact/patched
          cp kona/out/arch/arm64/boot/Image.gz ci/artifact/patched/
          cp kona/out/.config ci/artifact/patched/kona-ohos_defconfig.used
          tail -n 400 ci/build-patched.log > ci/artifact/patched/build-tail.log

      - name: collect
        if: always()
        run: |
          mkdir -p ci/artifact
          cp ci/patch-report.txt ci/artifact/ 2>/dev/null || true
          cp ci/build-patched.log ci/artifact/ 2>/dev/null || true
          cd ci/artifact && find . -type f -exec md5sum {} \; | sort > MD5.txt && cat MD5.txt

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kona-ohos
          path: ci/artifact
          retention-days: 7
